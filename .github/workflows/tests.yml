name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/phpunit

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - run: bats tests/bats
