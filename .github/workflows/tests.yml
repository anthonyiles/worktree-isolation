name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        exclude:
          # Laravel 13 needs PHP 8.3+.
          - php: '8.2'
            laravel: '13'
    name: phpunit (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: >
          composer require --dev --no-update
          "illuminate/support:^${{ matrix.laravel }}.0"
          "orchestra/testbench:^${{ matrix.testbench }}.0"

      - run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/phpunit

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - run: bats tests/bats

      - name: Shellcheck
        run: shellcheck -S warning stubs/bin/worktree stubs/bin/worktree-install stubs/bin/worktree-setup stubs/bin/test stubs/bin/_worktree-lib.sh stubs/githooks/*.sh
